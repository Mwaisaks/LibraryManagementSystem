spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library
    username: root
    password: Kundan@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect


library:
  fine:
    daily-rate: 1.00
    max-fine: 50.00
    grace-period-days: 0
  reservation:
    default-expiration-days: 3
    availability-expiration-days: 2
    max-active-reservations-per-user: 5
  borrowing:
    default-loan-period-days: 14
    max-books-per-user: 5

logging:
  level:
    com.mwaisaka.Library.Management.System: DEBUG
    org.springframework.scheduling: DEBUG